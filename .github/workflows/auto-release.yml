name: Auto-release on PR merge

on:
  push:
    branches:
      - master

jobs:
  auto-release:
    # Only run if this is a merge commit (or direct push to master)
    # and the commit doesn't already contain a version bump tag
    if: "!contains(github.event.head_commit.message, 'skip-release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          # Read current version from manifest.json
          CURRENT=$(node -p "require('./manifest.json').version")
          echo "Current version: $CURRENT"

          # Bump patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # Update manifest.json
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '$NEW_VERSION';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, '\t') + '\n');
          "

          # Update versions.json
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            v['$NEW_VERSION'] = m_minAppVersion;
            fs.writeFileSync('versions.json', JSON.stringify(v, null, '\t') + '\n');
          " || node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const v = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            v['$NEW_VERSION'] = m.minAppVersion;
            fs.writeFileSync('versions.json', JSON.stringify(v, null, '\t') + '\n');
          "

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Commit version bump and tag
        run: |
          git add manifest.json versions.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip-release]"
          git tag ${{ steps.bump.outputs.new_version }}
          git push origin master
          git push origin ${{ steps.bump.outputs.new_version }}

      - name: Create release with assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.bump.outputs.new_version }}"
          # Check if styles.css exists
          STYLES_ARG=""
          [ -f styles.css ] && STYLES_ARG="styles.css"

          gh release create "$tag" \
            --title "Great Day $tag" \
            --generate-notes \
            main.js manifest.json $STYLES_ARG
